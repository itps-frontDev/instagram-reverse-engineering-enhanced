version: '3.9'

services:

  frontend:
    build:
      dockerfile: Dockerfile.dev   # sovrascrive il Dockerfile base
    volumes:
      - ./frontend:/app            # bind mount: codice dal tuo PC
      - /app/node_modules          # volume anonimo: protegge i node_modules Linux
                                   # installati durante il build per Alpine/Linux,
                                   # impedendo che vengano sovrascritti da quelli
                                   # del tuo PC (Windows/Mac)
      - pnpm_store:/root/.local/share/pnpm/store
                                   # named volume: store globale di pnpm.
                                   # pnpm scarica ogni pacchetto UNA VOLTA in questa
                                   # cartella e usa symlink in node_modules.
                                   # Con questo volume, i pacchetti sopravvivono
                                   # ai rebuild del container → molto più veloce
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      AUTH_BYPASS: "false"
      # Su Windows, Docker non propaga gli eventi di modifica
      # file al container WSL2. WATCHPACK_POLLING forza Next.js
      # a controllare i file ogni tot millisecondi invece di
      # aspettare gli eventi → hot reload funziona su Windows.

  backend:
    build:
      dockerfile: Dockerfile.dev   # sovrascrive il Dockerfile base
    volumes:
      - ./backend:/app             # bind mount: codice dal tuo PC
      - gradle_cache:/root/.gradle # named volume: cache Gradle.
                                   # Senza questo volume, ogni rebuild del container
                                   # riscaricherebbe centinaia di MB di dipendenze.
    environment:
      SPRING_PROFILES_ACTIVE: dev
      AZURE_STORAGE_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OdFHQjFQYQRAFxRBUMJELnMmLmApXQKGzWhEZqkT0aT3GQqfJHKzA==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      # Sovrascrive la variabile del base compose.
      # Usa "azurite" come hostname: Docker risolve il nome
      # del servizio nella rete interna dei container.
      # AccountName e AccountKey sono i valori fissi e
      # pubblici di Azurite (non sono credenziali reali).
      AZURE_STORAGE_CONTAINER_NAME: dev-container
    ports:
      - "5005:5005"                # porta debugger remoto Java (IntelliJ/VSCode)
    depends_on:
      - azurite
      # In sviluppo il backend deve aspettare anche Azurite.
      # Nel base compose non c'è questa dipendenza perché
      # in produzione si usa Azure reale (nessun container).

  db:
    ports:
      - "5432:5432"
      # Espone PostgreSQL verso il tuo PC.
      # Permette di connettersi con DBeaver, TablePlus
      # o IntelliJ Database Tool durante lo sviluppo.
      # In produzione questa porta NON è esposta.

  redis:
    ports:
      - "6379:6379"
      # Stesso motivo: espone Redis per Redis Insight
      # o altri tool di ispezione in sviluppo.

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    # Definito SOLO nell'override: Azurite è un emulatore locale,
    # in produzione non esiste — si usa Azure Blob Storage reale.
    volumes:
      - azuritedata:/data
      # Named volume: i blob caricati sopravvivono ai restart del container
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
    # --blobHost 0.0.0.0 → raggiungibile da tutti i container nella rete Docker
    # --location /data   → salva i dati nel volume montato
    ports:
      - "10000:10000"   # Blob service  → Azure Storage Explorer / tool locali
      - "10001:10001"   # Queue service
      - "10002:10002"   # Table service

volumes:
  gradle_cache:    # cache Gradle persistente tra rebuild
  pnpm_store:      # store globale pnpm persistente tra rebuild
  azuritedata:     # blob e dati Azurite persistenti tra rebuild
services:

  # ── FRONTEND ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev   # sovrascrive il Dockerfile base
    volumes:
      - ./frontend:/app            # bind mount: codice dal tuo PC
      - /app/node_modules          # volume anonimo: protegge i node_modules Linux
                                   # installati durante il build per Alpine/Linux,
                                   # impedendo che vengano sovrascritti da quelli
                                   # del tuo PC (Windows/Mac)
      - /app/.next                 # volume anonimo: isola la cache di Turbopack dentro
                                   # Docker. Impedisce che una cache parziale dal PC
                                   # (lasciata dal run precedente) causi 404 all'avvio.
      - pnpm_store:/root/.local/share/pnpm/store
                                   # named volume: store globale di pnpm.
                                   # pnpm scarica ogni pacchetto UNA VOLTA in questa
                                   # cartella e usa symlink in node_modules.
                                   # Con questo volume, i pacchetti sopravvivono
                                   # ai rebuild del container → molto più veloce
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      # Su Windows, Docker non propaga gli eventi di modifica
      # file al container WSL2. WATCHPACK_POLLING forza Next.js
      # a controllare i file ogni tot millisecondi invece di
      # aspettare gli eventi → hot reload funziona su Windows.

  # ── CORE (monolite Spring Boot) ────────────────────────
  # Il bind mount porta il sorgente dal PC nel container.
  # Per applicare le modifiche: docker-compose restart core
  core:
    build:
      context: ./backend
      dockerfile: core/Dockerfile.dev   # sovrascrive il Dockerfile base
    volumes:
      - ./backend:/app                  # bind mount: tutta la root multi-module
      - gradle_cache_core:/root/.gradle # named volume: cache Gradle.
                                        # Senza questo volume, ogni rebuild del container
                                        # riscaricherebbe centinaia di MB di dipendenze.
    environment:
      SPRING_PROFILES_ACTIVE: dev
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      # Sovrascrive la variabile del base compose.
      # Usa "azurite" come hostname: Docker risolve il nome
      # del servizio nella rete interna dei container.
      # AccountName e AccountKey sono i valori fissi e
      # pubblici di Azurite (non sono credenziali reali).
      AZURE_STORAGE_CONTAINER_NAME: dev-container
    ports:
      - "5005:5005"                # porta debugger remoto Java (IntelliJ/VSCode)
    depends_on:
      - azurite
      # In produzione Azurite non esiste — si usa Azure Blob Storage reale.

  # ── DIRECTS SERVICE ───────────────────────────────────
  # Stesso bind mount di core — entrambi puntano a ./backend (root multi-module).
  # Per applicare le modifiche: docker-compose restart directs-service
  directs-service:
    build:
      context: ./backend
      dockerfile: directs-service/Dockerfile.dev
    volumes:
      - ./backend:/app                      # stessa root di core — Gradle gestisce i sottomoduli
      - gradle_cache_directs:/root/.gradle  # volume SEPARATO da core: se i due container
                                            # condividessero lo stesso volume e partissero
                                            # contemporaneamente, Gradle andrebbe in deadlock
                                            # su /app/.gradle/*/fileHashes.lock
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "5006:5006"                # porta debugger remoto Java separata da core

  # ── SERVICE DISCOVERY (Eureka) ────────────────────────
  # Dockerfile unico per tutti i moduli backend: MODULE e PORT
  # selezionano cosa compilare (vedi backend/Dockerfile).
  service-discovery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: service-discovery
        PORT: "8761"
    ports:
      - "8761:8761"   # Dashboard Eureka raggiungibile da browser in sviluppo

  # ── CONFIG SERVER ─────────────────────────────────────
  config-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: config-server
        PORT: "8888"
    ports:
      - "8888:8888"   # Utile in sviluppo per verificare la config: GET /core/default

  # ── API GATEWAY ───────────────────────────────────────
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
        PORT: "8080"
    ports:
      - "8080:8080"   # Accesso diretto dal browser

  # ── DATABASE ──────────────────────────────────────────
  db:
    ports:
      - "5432:5432"
      # Espone PostgreSQL verso il tuo PC.
      # Permette di connettersi con DBeaver, TablePlus
      # o IntelliJ Database Tool durante lo sviluppo.
      # In produzione questa porta NON è esposta.

  # ── REDIS ─────────────────────────────────────────────
  redis:
    ports:
      - "6379:6379"
      # Stesso motivo: espone Redis per Redis Insight
      # o altri tool di ispezione in sviluppo.

  # ── AZURITE ─────────────────────────────────────────────
  azurite:
    # Tag pinnato: senza tag Docker usa "latest", che cambia sotto i piedi
    # tra un pull e l'altro e rende l'ambiente non riproducibile.
    # NB: la versione deve supportare l'API version richiesta dall'SDK Azure
    # del core (azure-storage-blob 12.31.1 → API 2025-07-05 → Azurite >= 3.35).
    # Se si aggiorna il BOM Azure, probabilmente va aggiornato anche questo tag.
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    volumes:
      - azuritedata:/data
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data"
    ports:
      - "10000:10000"   # Blob service  → Azure Storage Explorer / tool locali
      - "10001:10001"   # Queue service
      - "10002:10002"   # Table service

volumes:
  gradle_cache_core:     # cache Gradle di core, persistente tra rebuild
  gradle_cache_directs:  # cache Gradle di directs-service, separata per evitare lock conflict
  pnpm_store:            # store globale pnpm persistente tra rebuild
  azuritedata:           # blob e dati Azurite persistenti tra rebuild

$kind: http-request
name: Update Privacy
description: Aggiorna la privacy del profilo autenticato tramite Spring Boot. Se il profilo passa da privato a pubblico, promuove automaticamente in bulk le richieste follow pending.
method: PUT
url: "{{baseUrl}}/api/priv/profiles/privacy"
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |
    {
      "isPrivate": false
    }
scripts:
  - type: afterResponse
    code: "var json = pm.response.json();\r\n\r\npm.test('Request succeeded', function () {\r\n  pm.expect(json.success).to.eql(true);\r\n});\r\n\r\npm.test('Privacy payload is present', function () {\r\n  pm.expect(json.data).to.be.an('object');\r\n  pm.expect(json.data).to.have.property('isPrivate');\r\n  pm.expect(json.data).to.have.property('promotedFollowsCount');\r\n});"
    language: text/javascript
order: 1023

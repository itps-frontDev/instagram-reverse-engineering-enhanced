$kind: http-request
name: Update Personal Info
description: Aggiorna username e nome completo del profilo autenticato tramite Spring Boot. Usa questa request per verificare il flusso write del modulo profile dopo la migrazione Strangler.
method: PUT
url: "{{baseUrl}}/api/priv/profiles/personal"
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |
    {
      "username": "lukewhite",
      "full_name": "Luke White"
    }
scripts:
  - type: afterResponse
    code: "var json = pm.response.json();\r\n\r\npm.test('Request succeeded', function () {\r\n  pm.expect(json.success).to.eql(true);\r\n});\r\n\r\npm.test('Profile payload is present (data.profile or legacy profile)', function () {\r\n  pm.expect(json.data && json.data.profile || json.profile).to.be.ok;\r\n});"
    language: text/javascript
order: 1030

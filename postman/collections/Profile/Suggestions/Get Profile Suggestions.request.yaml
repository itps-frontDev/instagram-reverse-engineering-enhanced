$kind: http-request
name: Get Profile Suggestions
description: >
  Restituisce fino a 5 profili pubblici suggeriti all'utente autenticato, non ancora seguiti.
  Ordinati per popolarità con randomizzazione sui top 20.
  Response: { "success": true, "data": [{ "id", "username", "fullName", "profileImageUrl", "followersCount" }] }.
method: GET
url: "{{baseUrl}}/api/priv/follows/suggestions"
headers:
  Authorization: Bearer {{accessToken}}
order: 1000

$kind: http-request
name: Refresh Token
description: Rinnova accessToken e refreshToken a partire dal refreshToken corrente.
method: POST
url: "{{baseUrl}}/api/public/auth/refresh"
headers:
  Content-Type: application/json
body:
  type: json
  content: |
    {
      "refreshToken": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    code: "var json = pm.response.json();\r\n\npm.environment.set(\"accessToken\", json.accessToken);\r\n\npm.environment.set(\"refreshToken\", json.refreshToken);\r\n\npm.environment.set(\"expiresIn\", json.expiresIn);\r\n\npm.environment.set(\"refreshExpiresIn\", json.refreshExpiresIn);"
    language: text/javascript
order: 2000

$kind: http-request
name: Login
description: Autentica l'utente con identifier e password. Salva accessToken e refreshToken come variabili di collection.
method: POST
url: "{{baseUrl}}/api/public/auth/login"
headers:
  Content-Type: application/json
body:
  type: json
  content: |
    {
      "identifier": "masonthompson4",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: "var json = pm.response.json();\r

      pm.collectionVariables.set(\"accessToken\", json.accessToken);\r

      pm.collectionVariables.set(\"refreshToken\", json.refreshToken);\r

      pm.collectionVariables.set(\"expiresIn\", json.expiresIn);\r

      pm.collectionVariables.set(\"refreshExpiresIn\", json.refreshExpiresIn);"
    language: text/javascript
order: 1000

$kind: http-request
name: Dispatch Notification
description: >
  Crea una notifica con orchestrazione strategy.
  Richiede senderProfileId coerente con il profilo autenticato.
  Error case: 400 NOTIFICATION_VALIDATION_ERROR per type/reference invalidi o self-notification.
method: POST
url: "{{baseUrl}}/api/priv/notifications/dispatch"
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |
    {
      "recipientProfileId": 2,
      "senderProfileId": 1,
      "type": "follow_request",
      "referenceType": "profile",
      "referenceId": 1
    }
order: 1500

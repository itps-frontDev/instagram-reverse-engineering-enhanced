$kind: http-request
name: Mark Read
description: >
  Marca come letta una singola notifica.
  Success example: { "success": true, "data": { "success": true, "updatedCount": 1 } }.
  Error case: 404 NOTIFICATION_NOT_FOUND se UUID non esiste o non appartiene al destinatario.
method: PATCH
url: "{{baseUrl}}/api/priv/notifications/{{notificationUuid}}/read"
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
order: 1300

services:

  # ── FRONTEND ──────────────────────────────────────────
  frontend:
    # REGISTRY e TAG sovrascrivibili da .env — i default riproducono
    # il comportamento precedente (ACR, tag 1.0.0).
    image: ${REGISTRY:-instagramregistry-g8csa4hhfnbmhfby.azurecr.io}/frontend:${TAG:-1.0.0}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # NEXT_PUBLIC_*: efficaci SOLO in sviluppo, dove `next dev` le legge
      # a runtime. Nell'immagine di produzione sono già inlinate nel bundle
      # durante `pnpm build` — lì vanno passate come build args
      # (vedi frontend/Dockerfile, stage builder).
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_WS_URL: ${API_URL}/ws
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      # Con la nuova architettura il frontend parla con il gateway, non direttamente con core.
      # Il gateway è l'unico punto di ingresso su porta 8080 e smista lui verso i servizi giusti.
      SPRING_API_BASE_URL: http://api-gateway:8080
      AUTH_ACCESS_TOKEN_COOKIE_NAME: ${AUTH_ACCESS_TOKEN_COOKIE_NAME}
      AUTH_ACCESS_TOKEN_COOKIE_PATH: ${AUTH_ACCESS_TOKEN_COOKIE_PATH}
      AUTH_REFRESH_TOKEN_COOKIE_NAME: ${AUTH_REFRESH_TOKEN_COOKIE_NAME}
      AUTH_REFRESH_TOKEN_COOKIE_PATH: ${AUTH_REFRESH_TOKEN_COOKIE_PATH}
    depends_on:
      api-gateway:
        condition: service_healthy
        # Il frontend parte solo quando il gateway risponde sull'actuator —
        # niente più finestra in cui la UI è su ma le API non rispondono.

  # ── SERVICE DISCOVERY (Eureka) ────────────────────────
  # Registro centrale: ogni microservizio si registra qui all'avvio
  # e il gateway interroga Eureka per sapere su quale IP:porta gira un servizio.
  # Parte per primo perché tutti gli altri dipendono da lui.
  service-discovery:
    image: ${REGISTRY:-instagramregistry-g8csa4hhfnbmhfby.azurecr.io}/service-discovery:${TAG:-1.0.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s   # i fallimenti durante il bootstrap non consumano retries

  # ── CONFIG SERVER ─────────────────────────────────────
  # Fonte centralizzata di configurazione per tutti i microservizi.
  # Legge i file .properties da classpath:/config e li serve via HTTP.
  # NON si registra su Eureka (altrimenti i servizi non possono trovarlo
  # prima di avere la config — un classico problema chicken-and-egg).
  config-server:
    image: ${REGISTRY:-instagramregistry-g8csa4hhfnbmhfby.azurecr.io}/config-server:${TAG:-1.0.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── CORE (monolite Spring Boot) ────────────────────────
  # Gestisce tutto tranne i messaggi diretti: auth, profili, post, storie, notifiche, ecc.
  # La porta 8081 NON è esposta all'esterno: il traffico arriva sempre tramite api-gateway.
  core:
    image: ${REGISTRY:-instagramregistry-g8csa4hhfnbmhfby.azurecr.io}/core:${TAG:-1.0.0}
    restart: unless-stopped
    healthcheck:
      # /actuator/health è permitAll nel SecurityConfig (serve solo per questo check)
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s   # bootstrap Spring + migrazioni Liquibase.
                          # In dev la prima compilazione Gradle può superarlo:
                          # lo stato "unhealthy" è solo cosmetico finché
                          # nessun servizio dipende dalla salute di core.
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      # "db" è il nome del servizio PostgreSQL definito sotto —
      # Docker risolve automaticamente "db" come hostname
      # nella rete interna dei container
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      # "redis" è il nome del servizio Redis — stessa convenzione di "db"
      SPRING_DATA_REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # ── DIRECTS SERVICE ───────────────────────────────────
  # Microservizio dedicato alla messaggistica in tempo reale (WebSocket + REST).
  # Condivide il database con core ma gestisce autonomamente le proprie tabelle
  # (chat, messages, chat_participants) tramite migrazioni Liquibase separate
  # (directs-service/src/main/resources/db/changelog).
  # La porta 8082 NON è esposta all'esterno: il traffico arriva tramite api-gateway.
  directs-service:
    image: ${REGISTRY:-instagramregistry-g8csa4hhfnbmhfby.azurecr.io}/directs-service:${TAG:-1.0.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      # Stesso DB di core — directs legge/scrive le stesse tabelle.
      # "db" viene risolto da Docker come hostname del container PostgreSQL.
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Stesso segreto JWT di core — i token emessi da core sono validi anche qui
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # ── API GATEWAY ───────────────────────────────────────
  # Unico punto di ingresso pubblico su porta 8080.
  # Non contiene logica: smista le richieste verso i servizi interni
  # basandosi sulle route definite in config-server/config/api-gateway.properties.
  #   /ws/**                  → directs-service (WebSocket STOMP)
  #   /api/priv/direct/**     → directs-service (REST)
  #   /**                     → core (tutto il resto)
  api-gateway:
    image: ${REGISTRY:-instagramregistry-g8csa4hhfnbmhfby.azurecr.io}/api-gateway:${TAG:-1.0.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "8080:8080"   # Unica porta esposta all'esterno
    depends_on:
      service-discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # ── DATABASE ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Named volume: i dati del DB sopravvivono ai restart del container
    healthcheck:
      # Verifica che PostgreSQL sia pronto ad accettare connessioni
      # prima che core o directs-service provino a connettersi
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s      # controlla ogni 5 secondi
      timeout: 5s       # se non risponde in 5s → fallito
      retries: 5        # dopo 5 tentativi falliti → unhealthy

  # ── REDIS ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
      # Named volume: sessioni e cache sopravvivono ai restart
    healthcheck:
      # redis-cli ping fallisce (exit != 0) finché il server non accetta connessioni
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

# Dichiarazione dei named volume —
# Docker li crea automaticamente al primo avvio
volumes:
  pgdata:
  redisdata:

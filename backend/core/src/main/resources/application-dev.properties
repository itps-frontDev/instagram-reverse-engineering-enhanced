# Configurazione specifica per sviluppo locale

# ── LIQUIBASE ─────────────────────────────────────────────
# Attiva i changeset con context="dev" (es. 004_dev_seed.xml)
spring.liquibase.contexts=dev


# Sovrascrive application.properties quando
# SPRING_PROFILES_ACTIVE=dev (nel docker-compose.override.yml)

# Log SQL: mostra le query eseguite da JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log level più verboso in sviluppo
logging.level.com.iree=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Abilita il restart automatico di Spring Boot quando
# rileva modifiche ai file compilati (hot reload).
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true


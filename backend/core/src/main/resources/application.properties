# ── SERVER ────────────────────────────────────────────────
spring.application.name=core

# Importa porta, Eureka URL e config JPA dal Config Server.
# "optional:" significa: se Config Server non è raggiungibile,
# usa solo questo file senza crashare.
spring.config.import=optional:configserver:http://config-server:8888

# ── DATABASE ──────────────────────────────────────────────
# "db" è il nome del servizio PostgreSQL in docker-compose.
# Docker risolve automaticamente "db" come hostname interno.
# La sintassi ${VARIABILE:default} legge la variabile
# d'ambiente del container; se non c'è usa il valore default.
spring.datasource.url=jdbc:postgresql://db:5432/${DB_NAME:iree_db}
spring.datasource.username=${DB_USER:iree_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / HIBERNATE ───────────────────────────────────────
# validate: Hibernate controlla che lo schema DB corrisponda
# alle Entity Java, ma NON lo modifica.
# Liquibase è responsabile delle modifiche allo schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── REDIS ─────────────────────────────────────────────────
# "redis" è il nome del servizio Redis in docker-compose.
spring.data.redis.host=redis
spring.data.redis.port=6379

# ── LIQUIBASE ─────────────────────────────────────────────
# Gestisce la creazione e l'evoluzione dello schema PostgreSQL.
# Il changelog master include tutte le migration in ordine.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=prod

# ── AZURE BLOB STORAGE ────────────────────────────────────
# In produzione: DefaultEndpointsProtocol=https;AccountName=...;AccountKey=...
# In sviluppo (application-dev.properties): connection string Azurite
blob.connection-string=${AZURE_STORAGE_CONNECTION_STRING}

# Nome del container Blob (equivalente a una "cartella" root)
blob.container-name=${AZURE_STORAGE_CONTAINER_NAME:iree-media}

# ── MULTIPART ─────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── CORS ───────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ── JWT ────────────────────────────────────────────────────
# Base64 (256+ bit) secret, e.g. generated with: openssl rand -base64 32
auth.jwt.secret=${AUTH_JWT_SECRET:k9Vx7pL3mQ8zT2nR6sY1wE4uI7oP9aD3fG5hJ8kL0mN2qR4tY6uI9oP1aS3dF7gH}
auth.jwt.access-token-ttl=900
auth.jwt.refresh-token-ttl=604800
auth.jwt.issuer="instagram-be"

# Nome del servizio — usato da Eureka come identificatore e da Config Server
# per caricare il file di configurazione corretto (core.properties).
spring.application.name=core

# Importa la configurazione centralizzata dal Config Server.
# "optional:" significa che se il Config Server non è raggiungibile il servizio
# parte lo stesso con i valori locali (utile in sviluppo senza docker compose).
spring.config.import=optional:configserver:http://config-server:8888

# ── DATABASE ──────────────────────────────────────────────────────────────────
# Credenziali database — rimangono qui come env var perché sono dati sensibili
# che non devono finire nei file di config versionati su Git.
spring.datasource.url=jdbc:postgresql://db:5432/${DB_NAME:iree_db}
spring.datasource.username=${DB_USER:iree_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── AZURE BLOB STORAGE ────────────────────────────────────────────────────────
# In produzione: connection string Azure reale iniettata come variabile d'ambiente.
# In sviluppo (application-dev.properties): connection string Azurite locale.
blob.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
blob.container-name=${AZURE_STORAGE_CONTAINER_NAME:iree-media}

# ── CORS ──────────────────────────────────────────────────────────────────────
# Lista delle origini consentite, iniettata come variabile d'ambiente.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ── JWT ───────────────────────────────────────────────────────────────────────
# Segreto e parametri del token — rimangono qui perché il secret è sensibile
# e deve corrispondere a quello usato da tutti i servizi che verificano i token.
auth.jwt.secret=${AUTH_JWT_SECRET:k9Vx7pL3mQ8zT2nR6sY1wE4uI7oP9aD3fG5hJ8kL0mN2qR4tY6uI9oP1aS3dF7gH}
auth.jwt.access-token-ttl=900
auth.jwt.refresh-token-ttl=604800
auth.jwt.issuer="instagram-be"

# ── NOTIFICATIONS ─────────────────────────────────────────────────────────────
# Finestra entro cui una notifica identica (stesso mittente, destinatario, tipo
# e riferimento) viene considerata duplicata e scartata. Formato ISO-8601.
# Default: PT1H (1 ora). Abbassarlo riduce il debounce, alzarlo aumenta la protezione
# contro eventi duplicati ravvicinati.
notifications.deduplication-ttl=PT1H
# Numero massimo di notifiche restituibili in una singola chiamata alla lista.
notifications.max-list-limit=50

# Nome del servizio — usato da Eureka come identificatore e da Config Server
# per caricare il file di configurazione corretto (directs-service.properties)
spring.application.name=directs-service

# Importa la configurazione centralizzata dal Config Server.
# "optional:" significa che se il Config Server non è raggiungibile il servizio
# parte lo stesso con i valori locali (utile in sviluppo senza docker compose).
spring.config.import=optional:configserver:http://config-server:8888

# Credenziali database — rimangono qui come env var perché sono dati sensibili
# che non devono finire nei file di config versionati su Git.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Segreto JWT — deve essere lo stesso usato da core per firmare i token.
# Entrambi i servizi leggono la stessa variabile d'ambiente AUTH_JWT_SECRET
# iniettata da docker-compose: non c'è sincronizzazione automatica, è solo
# una convenzione che entrambi usano la stessa chiave.
auth.jwt.secret=${AUTH_JWT_SECRET}

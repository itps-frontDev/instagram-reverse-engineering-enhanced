# Configurazione specifica per sviluppo locale

# ── LIQUIBASE ─────────────────────────────────────────────────────────────────
# Attiva i changeset con context="dev" (es. changelog-dev-seed.xml)
# che inseriscono dati demo per chat e messaggi.
spring.liquibase.contexts=dev

# Sovrascrive il valore "prod" di config-server/directs-service.properties
# quando SPRING_PROFILES_ACTIVE=dev (nel docker-compose.override.yml).

# ── JPA ───────────────────────────────────────────────────────────────────────
# Log SQL: mostra le query eseguite da JPA/Hibernate.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── LOGGING ───────────────────────────────────────────────────────────────────
# Log level più verboso in sviluppo.
logging.level.com.iree=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.messaging=DEBUG

# ── DEV TOOLS ─────────────────────────────────────────────────────────────────
# Abilita il restart automatico di Spring Boot quando
# rileva modifiche ai file compilati (hot reload).
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

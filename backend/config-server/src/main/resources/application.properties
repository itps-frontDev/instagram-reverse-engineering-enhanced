spring.application.name=config-server
server.port=8888

# Backend native: legge i file di config da classpath:/config/
# I file config/core.properties, config/directs-service.properties, ecc.
# vengono impacchettati nel jar e serviti ai client che li richiedono
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config

# Non si registra con Eureka — deve essere raggiungibile dai servizi
# all'avvio, prima che Eureka sia completamente operativo
eureka.client.enabled=false
spring.cloud.config.import-check.enabled=false

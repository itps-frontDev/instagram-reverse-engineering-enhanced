server.port=8082

# Eureka
eureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/
eureka.instance.prefer-ip-address=true

# JPA — none: le migrazioni le gestisce Liquibase di questo stesso servizio
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Liquibase — directs-service gestisce autonomamente le tabelle chats/messages/chat_participants
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Il seed DM gira solo in dev (context="dev" nei changeset)
spring.liquibase.contexts=prod

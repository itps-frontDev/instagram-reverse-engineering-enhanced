server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://service-discovery:8761/eureka/
eureka.instance.prefer-ip-address=true

# Routing — le route più specifiche vanno PRIMA della catch-all
# WebSocket: SockJS usa sia HTTP che WS upgrade sullo stesso path /ws
spring.cloud.gateway.routes[0].id=directs-ws
spring.cloud.gateway.routes[0].uri=lb://directs-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/ws/**

# Direct REST
spring.cloud.gateway.routes[1].id=directs-rest
spring.cloud.gateway.routes[1].uri=lb://directs-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/priv/direct/**

# Catch-all: tutto il resto va al monolite core
spring.cloud.gateway.routes[2].id=core
spring.cloud.gateway.routes[2].uri=lb://core
spring.cloud.gateway.routes[2].predicates[0]=Path=/**
# Retry solo su GET e solo per eccezioni di connessione (connessione TCP chiusa prima della risposta).
# NON usiamo series=SERVER_ERROR per non ritentare errori applicativi legittimi (es. 500 business logic).
spring.cloud.gateway.routes[2].filters[0].name=Retry
spring.cloud.gateway.routes[2].filters[0].args.retries=2
spring.cloud.gateway.routes[2].filters[0].args.methods=GET
spring.cloud.gateway.routes[2].filters[0].args.exceptions=reactor.netty.http.client.PrematureCloseException,java.io.IOException

# Pool connessioni HTTP client verso il Core (Reactor Netty).
# Tomcat chiude le connessioni keep-alive dopo ~20s di inattività → il gateway
# potrebbe riutilizzare una connessione già chiusa, causando PrematureCloseException.
# 15s garantisce che le connessioni vengano scartate prima che Tomcat le chiuda.
spring.cloud.gateway.httpclient.pool.max-idle-time=PT15S

# Nome del servizio — usato da Eureka e da Config Server per caricare api-gateway.properties
spring.application.name=api-gateway

# Importa la configurazione (port, routing, eureka) dal Config Server.
# Le route spring.cloud.gateway.routes[*] vengono caricate da lì.
spring.config.import=optional:configserver:http://config-server:8888

# Disabilita il check che blocca l'avvio se Config Server non risponde.
# Necessario perché api-gateway è uno dei primi servizi a partire e
# il config-server potrebbe non essere ancora pronto.
spring.cloud.config.import-check.enabled=false

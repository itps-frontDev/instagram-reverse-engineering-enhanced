# ── SERVER ────────────────────────────────────────────────
spring.application.name=iree-backend
server.port=8080

# ── DATABASE ──────────────────────────────────────────────
# "db" è il nome del servizio PostgreSQL in docker-compose.
# Docker risolve automaticamente "db" come hostname interno.
# La sintassi ${VARIABILE:default} legge la variabile
# d'ambiente del container; se non c'è usa il valore default.
spring.datasource.url=jdbc:postgresql://db:5432/${DB_NAME:iree_db}
spring.datasource.username=${DB_USER:iree_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / HIBERNATE ───────────────────────────────────────
# validate: Hibernate controlla che lo schema DB corrisponda
# alle Entity Java, ma NON lo modifica.
# Liquibase è responsabile delle modifiche allo schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── REDIS ─────────────────────────────────────────────────
# "redis" è il nome del servizio Redis in docker-compose.
spring.data.redis.host=redis
spring.data.redis.port=6379

# ── LIQUIBASE ─────────────────────────────────────────────
# Gestisce la creazione e l'evoluzione dello schema PostgreSQL.
# Il changelog master include tutte le migration in ordine.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=prod

# ── AZURE BLOB STORAGE ────────────────────────────────────
# In sviluppo locale con Azurite (emulatore):
#   UseDevelopmentStorage=true
# In produzione su Azure:
#   DefaultEndpointsProtocol=https;AccountName=...;AccountKey=...
spring.cloud.azure.storage.blob.connection-string=${AZURE_STORAGE_CONNECTION_STRING:UseDevelopmentStorage=true}

# Nome del container Blob (equivalente a una "cartella" root)
spring.cloud.azure.storage.blob.container-name=${AZURE_STORAGE_CONTAINER_NAME:iree-media}

# ── OAUTH2 / AUTH CUTOVER ───────────────────────────────────
spring.security.oauth2.authorizationserver.issuer=${AUTH_ISSUER:http://localhost:8080}
auth.oauth2.server-base-url=${AUTH_SERVER_BASE_URL:http://localhost:8080}
auth.oauth2.frontend-base-url=${AUTH_FRONTEND_BASE_URL:http://localhost:3000}
auth.oauth2.client-id=${AUTH_CLIENT_ID:frontend-web}
auth.oauth2.client-secret=${AUTH_CLIENT_SECRET:frontend-web-secret}
auth.oauth2.redirect-uri=${AUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/callback}
auth.oauth2.scope=${AUTH_SCOPE:openid profile}
auth.oauth2.state-ttl-seconds=${AUTH_STATE_TTL_SECONDS:300}
auth.cookies.access-token-name=${AUTH_ACCESS_COOKIE_NAME:iree_access_token}
auth.cookies.refresh-token-name=${AUTH_REFRESH_COOKIE_NAME:iree_refresh_token}
auth.cookies.secure=${AUTH_COOKIES_SECURE:false}
